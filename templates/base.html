
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f6f7f4">
    <meta name="description" content="Prompt Shield helps developers assess prompt security risks and create safer prompts.">

    <title>{% block title %}Prompt Shield{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/modern.compact.css') }}">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body data-workspace-mode="{{ workspace_mode|default('scanner') }}">
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>

    <div class="app-shell">
        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>

    <div id="toast-container" class="toast-container" aria-live="polite"></div>


    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block scripts %}{% endblock %}

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            if (window.lucide) {
                window.lucide.createIcons();
            }
        });
    </script>
</body>
</html>
